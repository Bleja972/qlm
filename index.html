<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les Petits Défis CE1 - Questionner le Monde</title>
<style>
:root{--navy:#17324d;--green:#2f8f57;--red:#c94c4c;--purple:#6c63d9;--orange:#efb46d;--blue:#8fd3ff;--pink:#f6b9ca;--mint:#a9e5b1;--yellow:#ffe18a;--lav:#cabdff;--border:#ead2af}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fff8ef,#f8dfbd);color:#222}.app{max-width:980px;margin:0 auto;padding:18px}.shell{background:#fff;border:3px solid #efdbc0;box-shadow:0 10px 28px rgba(0,0,0,.10);overflow:hidden}header{text-align:center;padding:18px;background:linear-gradient(135deg,#ffe8bf,#ffd6a0 55%,#fff0d3);border-bottom:3px solid #efd4ad}.brand{color:var(--navy);font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.5px}h1{margin:8px 0 4px;font-size:clamp(30px,4vw,44px)}.subtitle{margin:0;color:#5c5c5c;font-size:18px}main{padding:20px}.level-title{text-align:center;color:var(--navy);font-size:24px;font-weight:900;margin-bottom:14px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.level-btn{border:3px solid var(--navy);background:var(--navy);color:#fff;min-height:80px;padding:10px;font-size:16px;font-weight:900;cursor:pointer}.level-btn small{display:block;margin-top:5px;font-size:12px}.level-btn.active{background:var(--green);border-color:var(--green)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}.stat{background:#fff8ef;border:2px solid var(--border);text-align:center;padding:10px;color:var(--navy);font-weight:900}.stat strong{display:block;font-size:28px;margin-top:4px}.progress{height:14px;background:#f1e4d2;border:1px solid #e0c7a4;margin-bottom:18px;overflow:hidden}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--navy),#557a9d);transition:width .25s ease}.card{background:linear-gradient(180deg,#fffdf9,#fff5e8);border:2px solid #ecd4b3;padding:22px 18px;text-align:center}.theme-tag{display:inline-block;background:#ffe6b2;border:2px solid #efc46b;color:var(--navy);padding:7px 14px;font-weight:900;margin-bottom:14px}.icon{font-size:68px;margin:5px 0 10px}.question{font-size:clamp(24px,4vw,34px);line-height:1.3;font-weight:900;color:var(--navy);margin:0 auto 20px;max-width:800px}.example-box{display:none;max-width:700px;margin:0 auto 18px;padding:14px 16px;background:#eef8ff;border:2px solid #8fc8e8;color:var(--navy);font-size:19px;font-weight:800;line-height:1.5}.example-box strong{color:#b66a12}.sequence{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:6px auto 22px}.seq-box{min-width:95px;padding:14px 12px;border:3px solid rgba(23,50,77,.25);font-size:24px;font-weight:900;color:var(--navy)}.seq-box:nth-child(5n+1){background:var(--blue)}.seq-box:nth-child(5n+2){background:var(--pink)}.seq-box:nth-child(5n+3){background:var(--mint)}.seq-box:nth-child(5n+4){background:var(--yellow)}.seq-box:nth-child(5n){background:var(--lav)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:760px;margin:0 auto}.choice{min-height:76px;border:3px solid #d89b56;background:#fffaf3;color:var(--navy);font-size:21px;font-weight:900;cursor:pointer;padding:12px}.choice.correct{background:#e6f5ec;border-color:var(--green);color:#1e6b40}.choice.wrong{background:#fdeaea;border-color:var(--red);color:#9b2e2e}.choice:disabled{cursor:default}.answer-entry{display:none;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 18px}.answer-entry input{width:220px;height:60px;border:3px solid var(--navy);text-align:center;font-size:28px;font-weight:900;color:var(--navy);background:#fff;outline:none}.feedback{min-height:38px;margin:18px 0 8px;font-size:23px;font-weight:900}.actions{display:flex;justify-content:center;gap:12px;margin-top:12px;flex-wrap:wrap}.action{border:none;color:#fff;padding:14px 24px;font-size:20px;font-weight:900;cursor:pointer}.validate{background:var(--green)}.next{background:var(--purple);display:none}.replay{background:var(--navy)}.end{display:none;text-align:center;padding:30px 12px 14px}.end h2{margin:0 0 10px;color:var(--navy);font-size:42px}.end p{font-size:24px;font-weight:900}@media(max-width:700px){.levels{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.seq-box{min-width:78px;font-size:20px}}
</style>
</head>
<body>
<div class="app"><div class="shell">
<header><div class="brand">Les Petits Défis CE1</div><h1>Questionner le Monde</h1><p class="subtitle">Le temps : jours, mois et dates</p></header>
<main>
<div class="level-title">Choisis ton niveau</div>
<div class="levels">
<button class="level-btn active" data-level="0">Niveau 1<small>Les jours de la semaine</small></button>
<button class="level-btn" data-level="1">Niveau 2<small>Les mois de l'année</small></button>
<button class="level-btn" data-level="2">Niveau 3<small>La date en abrégé</small></button>
</div>
<section id="game">
<div class="stats"><div class="stat">Question<strong id="qnum">1 / 10</strong></div><div class="stat">Score<strong id="score">0</strong></div><div class="stat">Réussites<strong id="good">0</strong></div></div>
<div class="progress"><div id="bar"></div></div>
<div class="card">
<div class="theme-tag" id="themeTag">Les jours de la semaine</div><div class="icon" id="icon">📅</div><div class="example-box" id="exampleBox"><strong>Exemple :</strong><br>12 janvier 2026 → 12/01/26<br>04/03/26 → 4 mars 2026</div><div class="question" id="question"></div><div class="sequence" id="sequence"></div><div class="choices" id="choices"></div>
<div class="answer-entry" id="answerEntry"><input id="answerInput" type="text" autocomplete="off"><button class="action validate" id="validateBtn" type="button">Valider</button></div>
<div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="action next" id="nextBtn" type="button">Question suivante</button></div>
</div></section>
<section class="end" id="end"><h2>Bravo !</h2><p id="finalText"></p><button class="action replay" id="replayBtn" type="button">Rejouer ce niveau</button></section>
</main></div></div>
<script>
const levels=[
{name:"Les jours de la semaine",icon:"📅",type:"choice",questions:[
{q:"Quel jour vient après lundi ?",a:"mardi",c:["mardi","mercredi","dimanche","vendredi"],s:["lundi","?"]},{q:"Quel jour vient avant vendredi ?",a:"jeudi",c:["jeudi","samedi","mardi","dimanche"],s:["?","vendredi"]},{q:"Quel jour vient après mercredi ?",a:"jeudi",c:["jeudi","mardi","vendredi","dimanche"],s:["mercredi","?"]},{q:"Quel jour précède mardi ?",a:"lundi",c:["lundi","mercredi","jeudi","samedi"],s:["?","mardi"]},{q:"Quel jour vient après samedi ?",a:"dimanche",c:["dimanche","vendredi","lundi","mercredi"],s:["samedi","?"]},{q:"Quel jour précède jeudi ?",a:"mercredi",c:["mercredi","vendredi","mardi","samedi"],s:["?","jeudi"]},{q:"Quel jour vient après vendredi ?",a:"samedi",c:["samedi","dimanche","jeudi","lundi"],s:["vendredi","?"]},{q:"Quel jour vient avant mercredi ?",a:"mardi",c:["mardi","lundi","jeudi","vendredi"],s:["?","mercredi"]},{q:"Quel jour vient après dimanche ?",a:"lundi",c:["lundi","mardi","samedi","jeudi"],s:["dimanche","?"]},{q:"Quel jour précède dimanche ?",a:"samedi",c:["samedi","vendredi","lundi","mercredi"],s:["?","dimanche"]}]},
{name:"Les mois de l'année",icon:"🗓️",type:"choice",questions:[
{q:"Quel mois vient après janvier ?",a:"février",c:["février","mars","décembre","avril"],s:["janvier","?"]},{q:"Quel mois vient avant avril ?",a:"mars",c:["mars","mai","février","juin"],s:["?","avril"]},{q:"Quel mois vient après juin ?",a:"juillet",c:["juillet","mai","août","septembre"],s:["juin","?"]},{q:"Quel mois précède décembre ?",a:"novembre",c:["novembre","octobre","janvier","septembre"],s:["?","décembre"]},{q:"Quel mois vient après août ?",a:"septembre",c:["septembre","juillet","octobre","novembre"],s:["août","?"]},{q:"Quel mois vient avant juin ?",a:"mai",c:["mai","avril","juillet","mars"],s:["?","juin"]},{q:"Quel mois suit mars ?",a:"avril",c:["avril","mai","février","juin"],s:["mars","?"]},{q:"Quel mois précède octobre ?",a:"septembre",c:["septembre","novembre","août","juillet"],s:["?","octobre"]},{q:"Quel mois vient après novembre ?",a:"décembre",c:["décembre","octobre","janvier","septembre"],s:["novembre","?"]},{q:"Quel mois vient avant février ?",a:"janvier",c:["janvier","mars","décembre","avril"],s:["?","février"]}]},
{name:"La date en abrégé",icon:"✍️",type:"mixed",questions:[
{q:"Écris cette date en abrégé :",prompt:"12 janvier 2026",a:"12/01/26"},{q:"Écris cette date en toutes lettres :",prompt:"04/03/26",a:"4 mars 2026"},{q:"Écris cette date en abrégé :",prompt:"7 février 2026",a:"07/02/26"},{q:"Écris cette date en toutes lettres :",prompt:"21/06/26",a:"21 juin 2026"},{q:"Écris cette date en abrégé :",prompt:"30 septembre 2026",a:"30/09/26"},{q:"Écris cette date en toutes lettres :",prompt:"15/11/26",a:"15 novembre 2026"},{q:"Écris cette date en abrégé :",prompt:"1 mai 2026",a:"01/05/26"},{q:"Écris cette date en toutes lettres :",prompt:"08/12/26",a:"8 décembre 2026"},{q:"Écris cette date en abrégé :",prompt:"24 août 2026",a:"24/08/26"},{q:"Écris cette date en toutes lettres :",prompt:"03/10/26",a:"3 octobre 2026"}]}
];
let currentLevel=0,current=0,score=0,good=0,locked=false;
const levelBtns=[...document.querySelectorAll('.level-btn')],exampleBox=document.getElementById('exampleBox'),qnum=document.getElementById('qnum'),scoreEl=document.getElementById('score'),goodEl=document.getElementById('good'),bar=document.getElementById('bar'),themeTag=document.getElementById('themeTag'),icon=document.getElementById('icon'),questionEl=document.getElementById('question'),sequence=document.getElementById('sequence'),choices=document.getElementById('choices'),answerEntry=document.getElementById('answerEntry'),answerInput=document.getElementById('answerInput'),validateBtn=document.getElementById('validateBtn'),feedback=document.getElementById('feedback'),nextBtn=document.getElementById('nextBtn'),game=document.getElementById('game'),end=document.getElementById('end'),finalText=document.getElementById('finalText'),replayBtn=document.getElementById('replayBtn');
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function render(){locked=false;const level=levels[currentLevel],q=level.questions[current];exampleBox.style.display=currentLevel===2?'block':'none';themeTag.textContent=level.name;icon.textContent=level.icon;qnum.textContent=`${current+1} / ${level.questions.length}`;scoreEl.textContent=score;goodEl.textContent=good;bar.style.width=`${(current/level.questions.length)*100}%`;feedback.textContent='';nextBtn.style.display='none';questionEl.textContent=q.q;sequence.innerHTML='';choices.innerHTML='';answerEntry.style.display='none';answerInput.value='';answerInput.disabled=false;validateBtn.disabled=false;if(level.type==='choice'){q.s.forEach(x=>{const d=document.createElement('div');d.className='seq-box';d.textContent=x;sequence.appendChild(d)});q.c.forEach(x=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=x;b.addEventListener('click',()=>choose(x,b));choices.appendChild(b)})}else{const d=document.createElement('div');d.className='seq-box';d.style.minWidth='250px';d.textContent=q.prompt;sequence.appendChild(d);answerEntry.style.display='flex';setTimeout(()=>answerInput.focus(),50)}}
function choose(value,btn){if(locked)return;locked=true;const q=levels[currentLevel].questions[current],buttons=[...choices.querySelectorAll('.choice')];buttons.forEach(b=>b.disabled=true);if(value===q.a){score++;good++;btn.classList.add('correct');feedback.style.color='var(--green)';feedback.textContent='Bravo !'}else{btn.classList.add('wrong');const goodBtn=buttons.find(b=>b.textContent===q.a);if(goodBtn)goodBtn.classList.add('correct');feedback.style.color='var(--red)';feedback.textContent=`La bonne réponse était : ${q.a}.`}afterAnswer()}
function validateText(){if(locked)return;const q=levels[currentLevel].questions[current],val=answerInput.value.trim();if(!val){feedback.style.color='var(--red)';feedback.textContent='Écris une réponse.';answerInput.focus();return}locked=true;answerInput.disabled=true;validateBtn.disabled=true;if(normalize(val)===normalize(q.a)){score++;good++;feedback.style.color='var(--green)';feedback.textContent='Bravo !'}else{feedback.style.color='var(--red)';feedback.textContent=`La bonne réponse était : ${q.a}.`}afterAnswer()}
function afterAnswer(){const total=levels[currentLevel].questions.length;scoreEl.textContent=score;goodEl.textContent=good;bar.style.width=`${((current+1)/total)*100}%`;nextBtn.style.display='inline-block'}
function next(){current++;const total=levels[currentLevel].questions.length;if(current>=total){game.style.display='none';end.style.display='block';let txt=`Tu as obtenu ${score} bonne${score>1?'s':''} réponse${score>1?'s':''} sur ${total}.`;if(score===total)txt+=" C'est un sans-faute !";else if(score>=8)txt+=' Excellent travail !';else if(score>=6)txt+=' Bon travail !';else txt+=" Continue à t'entraîner.";finalText.textContent=txt;return}render()}
function startLevel(n){currentLevel=n;current=0;score=0;good=0;game.style.display='block';end.style.display='none';levelBtns.forEach((b,i)=>b.classList.toggle('active',i===n));render()}
levelBtns.forEach((b,i)=>b.addEventListener('click',()=>startLevel(i)));nextBtn.addEventListener('click',next);validateBtn.addEventListener('click',validateText);answerInput.addEventListener('keydown',e=>{if(e.key==='Enter'){if(!locked)validateText();else next()}});replayBtn.addEventListener('click',()=>startLevel(currentLevel));startLevel(0);
</script>
</body>
</html>
